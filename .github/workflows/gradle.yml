name: Java CI/CD with Gradle

on:
  push:
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      dashboards: ${{ steps.filter.outputs.dashboards }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            dashboards:
              - 'monitoring/grafana/**'
            code:
              - '**'
              - '!monitoring/grafana/**'

  build:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-build
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - run: ./gradlew build
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}

  build-native:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-build-native
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - run: ./gradlew :application-quarkus:testNative -Dquarkus.native.enabled=true -Dquarkus.native.container-build=true -Dquarkus.package.jar.enabled=false -Dquarkus.container-image.build=false
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}

  provision-grafana-dashboard:
    runs-on: ubuntu-latest
    if: always() && github.ref == 'refs/heads/main' && needs.changes.outputs.dashboards == 'true' && (needs.release.result == 'success' || needs.release.result == 'skipped')
    needs: [changes, release]
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-provision-grafana-dashboard
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Provision Grafana dashboards
        env:
          GRAFANA_CLOUD_SERVICE_ACCOUNT_TOKEN: ${{ secrets.GRAFANA_CLOUD_SERVICE_ACCOUNT_TOKEN }}
          GRAFANA_CLOUD_STACK_URL: ${{ secrets.GRAFANA_CLOUD_STACK_URL }}
          COMMIT_SHA: ${{ github.sha }}
        run: ./provision-grafana-dashboards.sh

  release:
    runs-on: ubuntu-latest
    if: ${{ needs.changes.outputs.code == 'true' && github.ref == 'refs/heads/main' }}
    needs: [changes, build, build-native]
    permissions:
      contents: write
      packages: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "<>"
      - name: Log into registry ghcr.io
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: ./gradlew release -x test -x testNative -Dquarkus.native.enabled=true -Dquarkus.native.container-build=true
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
      - run: |
          export DOCKER_TAG=$(docker images ghcr.io/christiangroth/spotify-control/quarkus --format "{{.Tag}} {{.CreatedAt}}" | sort -rk 2 | awk 'NR==1{print $1}')
          echo "DOCKER_TAG=$DOCKER_TAG" >> $GITHUB_ENV
          echo "Computed docker tag for next deployment $DOCKER_TAG"
      - name: Encode docker stack file
        run: echo "DOCKER_STACK_FILE=$(base64 -w 0 deploy/docker-stack.yml)" >> $GITHUB_ENV
      - name: Encode alloy config file
        run: echo "ALLOY_CONFIG_FILE=$(base64 -w 0 deploy/alloy/config.alloy)" >> $GITHUB_ENV
      - uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKER_STACK: "spotify-control"
          DOCKER_TAG: ${{ env.DOCKER_TAG }}
          DOCKER_STACK_FILE: ${{ env.DOCKER_STACK_FILE }}
          ALLOY_CONFIG_FILE: ${{ env.ALLOY_CONFIG_FILE }}
          MONGODB_CONNECTION_STRING: ${{ secrets.MONGODB_CONNECTION_STRING }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          APP_OAUTH_REDIRECT_URI: ${{ secrets.APP_OAUTH_REDIRECT_URI }}
          APP_TOKEN_ENCRYPTION_KEY: ${{ secrets.APP_TOKEN_ENCRYPTION_KEY }}
          HTTP_AUTH_ENCRYPTION_KEY: ${{ secrets.HTTP_AUTH_ENCRYPTION_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TRAEFIK_HTTP_ROUTERS_SPOTIFYCONTROL_RULE: ${{ secrets.TRAEFIK_HTTP_ROUTERS_SPOTIFYCONTROL_RULE }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GRAFANA_CLOUD_METRICS_URL: ${{ secrets.GRAFANA_CLOUD_METRICS_URL }}
          GRAFANA_CLOUD_METRICS_USERNAME: ${{ secrets.GRAFANA_CLOUD_METRICS_USERNAME }}
          GRAFANA_CLOUD_LOGS_URL: ${{ secrets.GRAFANA_CLOUD_LOGS_URL }}
          GRAFANA_CLOUD_LOGS_USERNAME: ${{ secrets.GRAFANA_CLOUD_LOGS_USERNAME }}
          GRAFANA_CLOUD_API_KEY: ${{ secrets.GRAFANA_CLOUD_API_KEY }}
          GRAFANA_CLOUD_STACK_URL: ${{ secrets.GRAFANA_CLOUD_STACK_URL }}
        with:
          host: ${{ secrets.CONTABO_SSH_HOST }}
          username: ${{ secrets.CONTABO_SSH_USER }}
          key: ${{ secrets.CONTABO_SSH_PRIVATE_KEY }}
          port: 22
          envs: DOCKER_STACK,DOCKER_TAG,DOCKER_STACK_FILE,ALLOY_CONFIG_FILE,MONGODB_CONNECTION_STRING,SPOTIFY_CLIENT_ID,SPOTIFY_CLIENT_SECRET,APP_OAUTH_REDIRECT_URI,APP_TOKEN_ENCRYPTION_KEY,HTTP_AUTH_ENCRYPTION_KEY,SLACK_WEBHOOK_URL,TRAEFIK_HTTP_ROUTERS_SPOTIFYCONTROL_RULE,GHCR_PAT,GRAFANA_CLOUD_METRICS_URL,GRAFANA_CLOUD_METRICS_USERNAME,GRAFANA_CLOUD_LOGS_URL,GRAFANA_CLOUD_LOGS_USERNAME,GRAFANA_CLOUD_API_KEY,GRAFANA_CLOUD_STACK_URL
          script_stop: true
          script: |
            echo "writing docker stack file"
            mkdir -p ~/$DOCKER_STACK/alloy
            echo "$DOCKER_STACK_FILE" | base64 -d > ~/$DOCKER_STACK/docker-stack.yml
            echo "$ALLOY_CONFIG_FILE" | base64 -d > ~/$DOCKER_STACK/alloy/config.alloy

            echo "login to ghcr.io"
            echo $GHCR_PAT | docker login ghcr.io -u christiangroth --password-stdin

            echo "deploying docker stack"
            DOCKER_TAG="$DOCKER_TAG" \
              MONGODB_CONNECTION_STRING="$MONGODB_CONNECTION_STRING" \
              SPOTIFY_CLIENT_ID="$SPOTIFY_CLIENT_ID" \
              SPOTIFY_CLIENT_SECRET="$SPOTIFY_CLIENT_SECRET" \
              APP_OAUTH_REDIRECT_URI="$APP_OAUTH_REDIRECT_URI" \
              APP_TOKEN_ENCRYPTION_KEY="$APP_TOKEN_ENCRYPTION_KEY" \
              HTTP_AUTH_ENCRYPTION_KEY="$HTTP_AUTH_ENCRYPTION_KEY" \
              SLACK_WEBHOOK_URL="$SLACK_WEBHOOK_URL" \
              TRAEFIK_HTTP_ROUTERS_SPOTIFYCONTROL_RULE="$TRAEFIK_HTTP_ROUTERS_SPOTIFYCONTROL_RULE" \
              GRAFANA_CLOUD_METRICS_URL="$GRAFANA_CLOUD_METRICS_URL" \
              GRAFANA_CLOUD_METRICS_USERNAME="$GRAFANA_CLOUD_METRICS_USERNAME" \
              GRAFANA_CLOUD_LOGS_URL="$GRAFANA_CLOUD_LOGS_URL" \
              GRAFANA_CLOUD_LOGS_USERNAME="$GRAFANA_CLOUD_LOGS_USERNAME" \
              GRAFANA_CLOUD_API_KEY="$GRAFANA_CLOUD_API_KEY" \
              GRAFANA_CLOUD_STACK_URL="$GRAFANA_CLOUD_STACK_URL" \
              docker stack deploy --detach=false --prune --with-registry-auth --resolve-image changed -c ~/$DOCKER_STACK/docker-stack.yml $DOCKER_STACK
            sleep 5

            echo
            echo "----- ----- -----"
            echo "----- ----- -----"
            echo "----- ----- -----"
            echo

            docker stack ls
            echo
            docker stack services $DOCKER_STACK
            echo
            docker stack ps $DOCKER_STACK
