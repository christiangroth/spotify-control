{#include layout.html}
    {#leftNavLinks}{/leftNavLinks}
    {#appVersion}<span class="app-version me-auto">{appBuildVersion}</span>{/appVersion}
    {#navLinks}{/navLinks}
    {#pageNav}{/pageNav}
    {#navbarSse}{/navbarSse}
    {#content}
    <div class="d-flex justify-content-center align-items-center" style="min-height: calc(100vh - 52px);">
        <div class="text-center" style="max-width: 420px; width: 100%;">
            {#if errorMessage}
            <div class="alert alert-danger mb-4 text-start" role="alert">{errorMessage}</div>
            {/if}
            <i class="bi bi-spotify d-block mx-auto mb-4" style="font-size:96px;color:#1db954;" aria-label="Spotify logo"></i>
            <a href="/oauth/authorize" class="btn btn-spotify btn-lg px-5 py-3" data-testid="login-button">
                Log in with Spotify
            </a>
        </div>
    </div>
    {/content}
{/include}
