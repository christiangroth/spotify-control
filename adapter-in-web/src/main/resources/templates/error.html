{#include layout.html}
    {#leftNavLinks}{/leftNavLinks}
    {#appVersion}<span class="app-version me-auto">{appBuildVersion}</span>{/appVersion}
    {#navLinks}{/navLinks}
    {#navbarSse}{/navbarSse}
    {#content}
    <div class="container py-4">
        <h1 class="fs-4 fw-semibold mb-4 text-danger">Error {statusCode}</h1>

        <div class="app-card card border mb-4">
            <div class="card-body">
                <p class="app-section-label mb-1">Type</p>
                <p class="mb-3 text-break">{errorType}</p>

                <p class="app-section-label mb-1">Message</p>
                <p class="mb-0 text-break">{message}</p>
            </div>
        </div>

        <div class="app-card card border">
            <div class="card-header">
                <span class="app-section-label">Stack Trace</span>
            </div>
            <div class="card-body p-0">
                <pre class="m-0 p-3" style="font-size:0.8rem;overflow-x:auto;white-space:pre-wrap;word-break:break-all;color:var(--color-text-primary);background:transparent;">{stackTrace}</pre>
            </div>
        </div>
    </div>
    {/content}
{/include}
