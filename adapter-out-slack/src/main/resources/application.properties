# SLACK SYSTEM NOTIFICATIONS
# --------------------------
# Slack incoming webhook URL – must be configured for notifications to be sent.
# Leave blank to disable sending; set via environment variable in production.
app.slack.webhook-url=
%prod.app.slack.webhook-url=${SLACK_WEBHOOK_URL:}

# Slack message appearance
app.slack.username=SpCtl
app.slack.icon-emoji=:robot_face:

# Individual toggles for system event notifications (all enabled by default)
app.slack.system-notifications.startup=true
app.slack.system-notifications.stopping=true
app.slack.system-notifications.outbox-partition-paused=true
app.slack.system-notifications.outbox-partition-resumed=true
app.slack.system-notifications.outbox-task-failed=true

# Individual toggles for playlist check notifications (all enabled by default)
app.slack.playlist-check-notifications.check-passed=true
app.slack.playlist-check-notifications.violations-changed=true

# Individual toggles for auth notifications (all enabled by default)
app.slack.auth-notifications.token-refresh-failed=true

# Individual toggles for playlist sync notifications (all enabled by default)
app.slack.playlist-sync-notifications.sync-failed=true

# Individual toggles for playback digest notifications (all enabled by default)
app.slack.playback-digest-notifications.weekly=true
