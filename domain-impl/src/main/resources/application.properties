# TOKEN ENCRYPTION
# ----------------
# Required in production: base64-encoded 32-byte AES-256 key
# Generate with: openssl rand -base64 32
%prod.app.token-encryption-key=${APP_TOKEN_ENCRYPTION_KEY}
# 32 bytes: 0x00..0x1F
%dev.app.token-encryption-key=AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
%test.app.token-encryption-key=AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=

# PLAYBACK
# --------
app.playback.minimum-progress-seconds=25

# DASHBOARD
# ---------
dashboard.recently-played.limit=13
dashboard.listening-stats.top-entries-limit=5

# FOLLOWED ARTISTS SCORING
# ------------------------
app.followed-artists.unfollow-lookback-days=90
app.followed-artists.unfollow-min-age-days=30
app.followed-artists.unfollow-max-playback-seconds=0
app.followed-artists.follow-lookback-weeks=4
app.followed-artists.follow-top-n=20
app.followed-artists.follow-min-occurrences=2
